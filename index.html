<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <!-- Links to your external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
        </header>

        <!-- Financial Insights Summary Cards -->
        <div class="summary-cards">
            <div class="card">
                <h3>Current Balance</h3>
                <p id="balance">₹0.00</p>
            </div>
            <div class="card">
                <h3>Total Income</h3>
                <p id="income" class="text-green">₹0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expense" class="text-red">₹0.00</p>
            </div>
        </div>

        <div class="main-grid">
            <!-- Add Transaction Form -->
            <div class="form-section">
                <h2>Add Transaction</h2>
                <form id="transaction-form">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-group">
                        <label for="desc">Description</label>
                        <input type="text" id="desc" required placeholder="e.g. Groceries">
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" required placeholder="0.00" step="0.01">
                    </div>
                    
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Food">Food</option>
                            <option value="Rent">Rent</option>
                            <option value="Salary">Salary</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    
                    <button type="submit" id="submit-btn">Add Transaction</button>
                </form>
            </div>

            <!-- Transaction History and Filters -->
            <div class="history-section">
                <h2>Transaction History</h2>
                <div class="filter-group">
                    <select id="filter-category">
                        <option value="All">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Salary">Salary</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <ul class="transaction-list" id="transaction-list">
                    <!-- Transactions will be dynamically rendered here by JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Links to your external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
